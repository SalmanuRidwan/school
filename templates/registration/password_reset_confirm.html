{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Confirm Password Reset{% endblock title %}
{% block content %}
<div class="container w-75">
    <h2>Confirm Password Reset</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form|crispy }}
        <input type="submit" value="Confirm" class="btn btn-success mt-3 mb-4">
    </form>
</div>
{% endblock content %}

{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Reset Password{% endblock title %}

{% block content %}
<div class="container w-75">
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <input type="submit" value="Reset Password" class="btn btn-primary mt-3 mb-4">
    </form>
</div>
{% endblock content %}
